<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마감의 숲</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#1F2A55; --sky-bot:#5B5E8E; --hill:#3F5A3A; --hill2:#4E6E45;
  --lamp:#FFCE5C; --lamp-glow:rgba(255,206,92,.55);
  --bg:#EEF1E7; --panel:#FFFFFF; --ink:#26233A; --muted:#6B6880; --line:#D9DCCD;
  --tile-a:#F3E7D2; --tile-b:#EADBC1; --tile-locked:#D5D8CB;
  --win-off:#3B3F5C; --accent:#4E6E45; --btn-ink:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16182A; --panel:#20233A; --ink:#ECEAF5; --muted:#A7A4BE; --line:#33374F;
    --tile-a:#3A3448; --tile-b:#332E40; --tile-locked:#262938; --win-off:#2A2D44; --accent:#7FA16F;
  }
}
:root[data-theme="dark"]{
  --bg:#16182A; --panel:#20233A; --ink:#ECEAF5; --muted:#A7A4BE; --line:#33374F;
  --tile-a:#3A3448; --tile-b:#332E40; --tile-locked:#262938; --win-off:#2A2D44; --accent:#7FA16F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;word-break:keep-all;overflow-wrap:break-word;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
h1,h2,h3,.jua{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
button{font:inherit;cursor:pointer}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}

/* 상단 바 */
.top{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;padding:.9rem 1.25rem;background:var(--sky-top);color:#F2EFFF}
.top h1{margin:0;font-size:1.5rem;letter-spacing:.02em}
.top .right{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.coin{background:rgba(255,255,255,.1);border-radius:999px;padding:.3rem .9rem;font-family:"Jua",sans-serif;font-size:1.05rem}
.voice-btn{border:0;border-radius:999px;padding:.45rem 1rem;background:#fff;color:var(--sky-top);font-family:"Jua",sans-serif}
.voice-btn.on{background:var(--lamp);color:#3A2A00;box-shadow:0 0 18px var(--lamp-glow)}
.ghost{border:1px solid rgba(255,255,255,.35);background:transparent;color:#F2EFFF;border-radius:999px;padding:.4rem .9rem}

/* 마을 */
.village{position:relative;background:linear-gradient(var(--sky-top),var(--sky-bot) 70%);overflow:hidden;padding:1.5rem 1rem 0}
.stars{position:absolute;inset:0;pointer-events:none}
.village-head{position:relative;max-width:1100px;margin:0 auto .5rem;color:#E6E3F7;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;align-items:baseline}
.village-head p{margin:0;font-size:.95rem;opacity:.85}
.lit-count{font-family:"Jua",sans-serif;font-size:1.1rem;color:var(--lamp)}
.houses{position:relative;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.5rem 1rem;padding-bottom:.25rem;z-index:2}
.pines{position:absolute;left:0;right:0;bottom:40%;width:100%;height:110px;z-index:0}
.trail{position:relative;z-index:2;max-width:1100px;height:92px;margin:0 auto}
.wolf{position:absolute;bottom:10px;left:2%;width:78px;text-align:center}
.wolf-svg{width:70px;height:auto;display:block;margin:0 auto}
.wolf .tag{font-family:"Jua",sans-serif;font-size:.85rem;color:#F2EFFF;background:rgba(0,0,0,.25);border-radius:999px;display:inline-block;padding:0 .55rem}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);width:max-content;max-width:200px;white-space:normal;text-align:center;line-height:1.4;background:#fff;color:#26233A;font-size:.82rem;border-radius:10px;padding:.3rem .65rem;margin-bottom:-4px;transition:opacity .4s}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff}
@media (prefers-reduced-motion:no-preference){
  .wolf{animation:roam 48s linear infinite alternate}
  .wolf-svg{animation:face 96s step-end infinite}
  @keyframes roam{from{left:8%}to{left:calc(92% - 78px)}}
  @keyframes face{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
}
.house{display:flex;flex-direction:column;align-items:center;text-align:center;color:#F2EFFF;background:none;border:0;padding:.25rem;border-radius:12px}
.house svg{width:100%;max-width:150px;height:auto;display:block}
.house .nm{font-family:"Jua",sans-serif;font-size:1.05rem;margin-top:.1rem}
.house .st{font-size:.8rem;opacity:.85}
.house.me .nm{color:var(--lamp)}
.ground{z-index:1;position:absolute;left:0;right:0;bottom:0;height:46%;background:var(--hill);border-radius:60% 60% 0 0/30% 30% 0 0}
.ground::before{content:"";position:absolute;left:-10%;right:30%;top:18%;bottom:0;background:var(--hill2);border-radius:50% 50% 0 0/25% 25% 0 0}
.lit .glowwin{filter:drop-shadow(0 0 5px var(--lamp))}
@media (prefers-reduced-motion:no-preference){
  .lit .glowwin{animation:flicker 3.2s ease-in-out infinite}
  @keyframes flicker{0%,100%{opacity:1}50%{opacity:.82}}
}

/* 본문 */
main{max-width:1100px;margin:0 auto;padding:1.25rem 1rem 3rem}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:.45rem 1rem;font-family:"Jua",sans-serif;font-size:1.02rem}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--btn-ink);border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:1.25rem}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.25rem}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.myhouse-head{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.myhouse-head svg{width:110px;height:auto;flex:none;background:var(--sky-top);border-radius:12px;padding:.3rem}
.myhouse-head h2{margin:0;font-size:1.5rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:.35rem 0 .2rem;max-width:340px}
.bar span{display:block;height:100%;background:var(--lamp);border-radius:99px;transition:width .4s}
.small{font-size:.88rem;color:var(--muted)}
.room-wrap{overflow-x:auto}

/* 마당 화단 */
.garden-lead{margin:.1rem 0 .55rem}
.seed-row{display:flex;flex-wrap:wrap;gap:.4rem .6rem;align-items:center;margin:0 0 .7rem}
.seed-row b{font-family:"Jua",sans-serif;font-weight:400}
.bed{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;background:#7A5A3C;border-radius:14px;padding:10px}
.plot{background:#9C7650;border-radius:10px;min-height:156px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 4px 8px;gap:4px;text-align:center}
.plot svg{width:100%;max-width:88px;height:auto}
.plot .pl{font-size:.78rem;color:#FFF3DF;line-height:1.35}
.plot .pl b{font-family:"Jua",sans-serif;font-weight:400;font-size:.95rem}
.plot.empty{justify-content:center;gap:.5rem}
.plot.lock{background:#6B5038;justify-content:center}
.plot.lock .pl{color:#D8C3A5}
.plot.bloom{background:#A7825A}
.plot.secret{background:#8E7AA8}
.plot .mini{background:#FFF3DF;color:#5A3E26;border-color:#FFF3DF;border-radius:999px;font-size:.8rem}
.plot .mini:disabled{opacity:.55}
.gdex-title{margin:1rem 0 .4rem}
.gdex{display:flex;flex-wrap:wrap;gap:6px}
.gdx{width:46px;height:46px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-family:"Jua",sans-serif}
.gdx svg{width:46px;height:46px}
.gdx.garden{border-color:#8DB8E0}
.gdx.secret{border:2px solid #B4A2DC}
.rtab.garden-tab{border-color:#8FD1B8}

:root{--tile:46px}
@media (max-width:600px){:root{--tile:36px} .cab span{font-size:.58rem} .cab.c3 span{font-size:.68rem} .cab.big span{font-size:1rem} .slot{width:52px;height:52px;font-size:1.6rem} .cab-slots{grid-template-columns:repeat(var(--cc,3),52px)!important} .tile,.furn{font-size:1.3rem} .furn.long{font-size:1.8rem} .furn.big{font-size:2.8rem}}
.room{display:grid;gap:3px;width:max-content;padding:8px;background:#8A6A4A;border-radius:10px;margin:0 auto}
.tile{width:var(--tile);height:var(--tile);border:0;border-radius:6px;font-size:1.65rem;display:grid;place-items:center;padding:0;line-height:1}
.tile.a{background:var(--tile-a)} .tile.b{background:var(--tile-b)}
.tile.ext.a{background:#E6D6B8} .tile.ext.b{background:#DCCBAA}
.tile.ext-lock{background:repeating-linear-gradient(45deg,var(--tile-locked) 0 6px,transparent 6px 12px),var(--tile-locked);font-size:1rem}
.room-tabs{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;margin:.2rem 0 .6rem}
.rtab{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:.3rem .85rem;font-family:"Jua",sans-serif;font-size:.92rem}
.rtab.on{background:var(--accent);border-color:var(--accent);color:var(--btn-ink)}
.rtab .ren{font-size:.8rem;margin-left:.15rem;cursor:pointer}
.rtab.add{border-style:dashed;color:var(--accent);border-color:var(--accent);background:var(--panel)}
.rtab.add:disabled{opacity:.45;cursor:not-allowed}
.fsvg{display:block;width:100%;height:100%}
.furn.drawn{padding:2px;background:rgba(255,255,255,.18)}
.furn.rot{position:relative;overflow:hidden}
.furn.r1 .fsvg,.furn.r3 .fsvg{position:absolute;left:50%;top:50%;width:var(--rh);height:var(--rw);transform:translate(-50%,-50%) rotate(90deg)}
.furn.r3 .fsvg{transform:translate(-50%,-50%) rotate(-90deg)}
.furn.r2 .fsvg{transform:scaleX(-1)}
.furn.rot:not(.drawn) > .emo{display:inline-block}
.furn.r1:not(.drawn) > .emo{transform:rotate(90deg)} .furn.r2:not(.drawn) > .emo{transform:scaleX(-1)} .furn.r3:not(.drawn) > .emo{transform:rotate(-90deg)}
.hint-ico{display:inline-block;transition:transform .2s}
.hint-ico.r1{transform:rotate(90deg)} .hint-ico.r2{transform:scaleX(-1)} .hint-ico.r3{transform:rotate(-90deg)}
.item .em .fsvg{height:1.9rem;width:auto;margin:0 auto}
.hint .fsvg{display:inline-block;height:1.3em;width:auto;vertical-align:-.3em}
.furn.cabf{padding:2px;background:transparent;box-shadow:none}
.cab{display:grid;gap:2px;width:100%;height:100%;padding:3px;background:linear-gradient(#B08559,#8A6A4A);border-radius:7px;box-shadow:inset 0 0 0 2px #6E5038}
.cab span{display:grid;place-items:center;background:rgba(255,255,255,.22);border-radius:3px;line-height:1;font-size:.72rem;overflow:hidden}
.cab.c3 span{font-size:.85rem}
.cab.big span{font-size:1.25rem}
.cab-slots{display:grid;gap:6px;justify-content:center;padding:10px;background:linear-gradient(#B08559,#8A6A4A);border-radius:12px;width:max-content;margin:0 auto}
.slot{width:64px;height:64px;border-radius:8px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:2rem;border:0}
.slot.full{background:rgba(255,255,255,.55);cursor:pointer}
.slot.full:hover{box-shadow:inset 0 0 0 2px #B4513E}
.visit-err{padding:1.4rem 1rem;text-align:center;color:#F4ECD8;font-family:"Jua",sans-serif;line-height:1.7}
.visit-err span{font-family:"Gowun Dodum",sans-serif;font-size:.8rem;opacity:.85;word-break:break-all}
.raid{text-align:center;margin-top:.6rem}
.raid-btn{border:1px solid #E0802F;background:#FFF1E2;color:#9A4A1E;border-radius:999px;padding:.4rem 1rem;font-family:"Jua",sans-serif;font-size:1rem}
.raid-btn:disabled{opacity:.5;cursor:not-allowed}
.raid .small{display:block;margin-top:.25rem}
.dex-line{text-align:center;margin:.6rem 0 0}
.tile.locked{background:var(--tile-locked);cursor:not-allowed;font-size:.9rem;color:var(--muted)}
.tile{grid-row:auto}
.tile.pv-ok{outline:2px dashed var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 22%,var(--tile-a))}
.tile.pv-no{outline:2px dashed #B4513E;outline-offset:-2px;background:color-mix(in srgb,#B4513E 22%,var(--tile-a))}
.furn{z-index:1;border:0;border-radius:8px;background:rgba(255,255,255,.35);font-size:1.65rem;line-height:1;display:grid;place-items:center;padding:0;box-shadow:inset 0 0 0 2px rgba(138,106,74,.35)}
.furn.long{font-size:2.3rem}
.furn.big{font-size:3.6rem}
.furn:hover{box-shadow:inset 0 0 0 2px #B4513E}
.room.placing .furn{pointer-events:none;opacity:.85}
.hint{text-align:center;margin:.6rem 0 0;min-height:1.5em}
h3{margin:0 0 .5rem;font-size:1.2rem}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:.5rem;margin-bottom:1.25rem}
.item{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:.45rem .3rem;display:flex;flex-direction:column;align-items:center;gap:.1rem}
.item .em{font-size:1.6rem;line-height:1.2}
.item .t{font-size:.8rem}
.item .p{font-family:"Jua",sans-serif;font-size:.9rem;color:var(--accent)}
.item{position:relative}
.item.owned{border-color:#8FD1B8}
.item .own{position:absolute;top:.3rem;right:.3rem;background:#E3F3EA;color:#2F6B4F;border-radius:999px;padding:0 .4rem;font-size:.68rem;line-height:1.5;font-family:"Jua",sans-serif}
.item.sel{border-color:var(--lamp);box-shadow:0 0 0 2px var(--lamp)}
.item:disabled{opacity:.45;cursor:not-allowed}
.empty{color:var(--muted);font-size:.9rem;margin:0 0 1.25rem}

/* 성장 단계 */
.road{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.75rem}
.road li{border:1px solid var(--line);border-radius:14px;padding:.75rem;text-align:center;background:var(--bg)}
.road li svg{width:100%;max-width:130px;background:var(--sky-top);border-radius:10px}
.road li.locked svg{filter:grayscale(1) brightness(.6)}
.road li.now{border-color:var(--lamp);box-shadow:0 0 0 2px var(--lamp)}
.road .step{font-size:.8rem;color:var(--muted)}
.road .nm{font-family:"Jua",sans-serif;font-size:1.1rem}

.rules{margin-top:1rem;font-size:.92rem;color:var(--muted)}
.rules p{margin:.25rem 0}
.toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(150%);background:var(--sky-top);color:#fff;padding:.8rem 1.2rem;border-radius:14px;font-family:"Jua",sans-serif;font-size:1.05rem;transition:transform .35s;z-index:10;max-width:90vw;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.show{transform:translateX(-50%) translateY(0)}
.house.ruin svg{filter:grayscale(.85) brightness(.75)}
.house.vacant{opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;margin:.25rem 0 .9rem}
.table-wrap{overflow-x:auto}
table.admin{width:100%;border-collapse:collapse;min-width:560px;font-size:.95rem}
table.admin th{text-align:left;font-weight:400;color:var(--muted);font-size:.85rem;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
table.admin td{padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
table.admin tr.d3 td{background:rgba(180,81,62,.1)}
.pill{display:inline-block;border-radius:999px;padding:.05rem .6rem;font-size:.82rem;background:var(--bg);border:1px solid var(--line)}
.pill.d1{border-color:#
